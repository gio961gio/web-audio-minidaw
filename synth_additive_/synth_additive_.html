<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Additive Synth</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="synth_additive_.css">
</head>

<body>
    <!-- ═══ TOP TOOLBAR ═══ -->
    <div class="toolbar">
        <div class="toolbar-left">
            <div class="octave-display" id="octave-display">
                <button class="octave-btn" id="octaveDownBtn" title="Octave Down (Z)">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <span class="octave-label">OCT <span id="octaveValue">4</span></span>
                <button class="octave-btn" id="octaveUpBtn" title="Octave Up (X)">
                    <i class="fas fa-chevron-up"></i>
                </button>
            </div>
            <div class="master-volume">
                <i class="fas fa-volume-high"></i>
                <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="0.5">
                <span id="masterVolumeValue">50%</span>
            </div>
        </div>
        <div class="toolbar-title">SYNTH ADDITIVE</div>
    </div>

    <!-- ═══ MAIN LAYOUT ═══ -->
    <div class="main-container">

        <!-- LEFT: Harmonic Sliders Panel -->
        <div class="harmonics-panel">
            <div class="panel-header">
                <i class="fas fa-wave-square"></i> HARMONICS
            </div>
            <div class="harmonics-grid" id="harmonicsGrid">
                <!-- Generated by JS: 16 harmonic sliders -->
            </div>
            <div class="harmonics-presets">
                <span class="preset-label">PRESETS</span>
                <button class="preset-btn" data-preset="sine" title="Sine">
                    <i class="fas fa-circle"></i> Sine
                </button>
                <button class="preset-btn" data-preset="sawtooth" title="Sawtooth">
                    <i class="fas fa-signal"></i> Saw
                </button>
                <button class="preset-btn" data-preset="square" title="Square">
                    <i class="fas fa-square"></i> Square
                </button>
                <button class="preset-btn" data-preset="triangle" title="Triangle">
                    <i class="fas fa-caret-up"></i> Triangle
                </button>
                <button class="preset-btn" data-preset="organ" title="Organ">
                    <i class="fas fa-church"></i> Organ
                </button>
                <button class="preset-btn" data-preset="bell" title="Bell">
                    <i class="fas fa-bell"></i> Bell
                </button>
                <button class="preset-btn" data-preset="brass" title="Brass">
                    <i class="fas fa-bullhorn"></i> Brass
                </button>
                <button class="preset-btn" data-preset="flute" title="Flute">
                    <i class="fas fa-wind"></i> Flute
                </button>
                <button class="preset-btn" data-preset="strings" title="Strings">
                    <i class="fas fa-guitar"></i> Strings
                </button>
                <button class="preset-btn" data-preset="clarinet" title="Clarinet">
                    <i class="fas fa-music"></i> Clarinet
                </button>
                <button class="preset-btn" data-preset="choir" title="Choir">
                    <i class="fas fa-users"></i> Choir
                </button>
                <button class="preset-btn" data-preset="pluck" title="Pluck">
                    <i class="fas fa-hand-point-up"></i> Pluck
                </button>
                <button class="preset-btn" data-preset="bass" title="Bass">
                    <i class="fas fa-drum"></i> Bass
                </button>
                <button class="preset-btn" data-preset="vintage" title="Vintage">
                    <i class="fas fa-compact-disc"></i> Vintage
                </button>
                <button class="preset-btn" data-preset="nasal" title="Nasal">
                    <i class="fas fa-face-grimace"></i> Nasal
                </button>
                <button class="preset-btn" data-preset="hollow" title="Hollow">
                    <i class="fas fa-ghost"></i> Hollow
                </button>
                <button class="preset-btn" data-preset="clear" title="Clear All">
                    <i class="fas fa-trash-can"></i> Clear
                </button>
            </div>
        </div>

        <!-- CENTER: Keyboard Visualizer + ADSR -->
        <div class="center-panel">

            <!-- ADSR Envelope -->
            <div class="adsr-panel">
                <div class="panel-header">
                    <i class="fas fa-chart-area"></i> ENVELOPE (ADSR)
                </div>
                <div class="adsr-controls">
                    <div class="adsr-knob-group">
                        <label>ATTACK</label>
                        <input type="range" class="adsr-slider" id="attackSlider" min="0.001" max="2" step="0.001"
                            value="0.01">
                        <span class="adsr-value" id="attackValue">10ms</span>
                    </div>
                    <div class="adsr-knob-group">
                        <label>DECAY</label>
                        <input type="range" class="adsr-slider" id="decaySlider" min="0.001" max="2" step="0.001"
                            value="0.1">
                        <span class="adsr-value" id="decayValue">100ms</span>
                    </div>
                    <div class="adsr-knob-group">
                        <label>SUSTAIN</label>
                        <input type="range" class="adsr-slider" id="sustainSlider" min="0" max="1" step="0.01"
                            value="0.7">
                        <span class="adsr-value" id="sustainValue">70%</span>
                    </div>
                    <div class="adsr-knob-group">
                        <label>RELEASE</label>
                        <input type="range" class="adsr-slider" id="releaseSlider" min="0.01" max="5" step="0.01"
                            value="0.3">
                        <span class="adsr-value" id="releaseValue">300ms</span>
                    </div>
                </div>
                <!-- ADSR Visualizer -->
                <canvas id="adsrCanvas" width="380" height="100"></canvas>
            </div>

            <!-- Filter Control -->
            <div class="filter-panel">
                <div class="panel-header">
                    <i class="fas fa-filter"></i> FILTER
                </div>
                <div class="filter-controls">
                    <div class="filter-group type-group">
                        <label>TYPE</label>
                        <div class="custom-select-container" id="filterTypeContainer">
                            <div class="custom-select-trigger" id="filterTypeTrigger">Lowpass</div>
                            <div class="custom-options" id="filterTypeOptions">
                                <div class="custom-option selected" data-value="lowpass">Lowpass</div>
                                <div class="custom-option" data-value="highpass">Highpass</div>
                                <div class="custom-option" data-value="bandpass">Bandpass</div>
                                <div class="custom-option" data-value="notch">Notch</div>
                            </div>
                        </div>
                    </div>
                    <div class="filter-slider-group">
                        <div class="filter-knob-group">
                            <label>CUTOFF</label>
                            <input type="range" class="filter-slider" id="cutoffSlider" min="20" max="20000" step="1"
                                value="20000">
                            <span class="filter-value" id="cutoffValue">20000Hz</span>
                        </div>
                        <div class="filter-knob-group">
                            <label>RESONANCE</label>
                            <input type="range" class="filter-slider" id="resonanceSlider" min="0" max="20" step="0.1"
                                value="1">
                            <span class="filter-value" id="resonanceValue">1.0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Vibrato & Tremolo Controls -->
            <div class="fx-container">
                <!-- Vibrato -->
                <div class="fx-panel">
                    <div class="panel-header">
                        <i class="fas fa-wave-square"></i> VIBRATO
                    </div>
                    <div class="fx-controls">
                        <div class="fx-group">
                            <label>RATE</label>
                            <input type="range" class="fx-slider" id="vibratoRate" min="0.1" max="15" step="0.1"
                                value="5">
                            <span class="fx-value" id="vibratoRateValue">5.0Hz</span>
                        </div>
                        <div class="fx-group">
                            <label>DEPTH</label>
                            <input type="range" class="fx-slider" id="vibratoDepth" min="0" max="100" step="1"
                                value="0">
                            <span class="fx-value" id="vibratoDepthValue">0%</span>
                        </div>
                    </div>
                </div>

                <!-- Tremolo -->
                <div class="fx-panel">
                    <div class="panel-header">
                        <i class="fas fa-volume-down"></i> TREMOLO
                    </div>
                    <div class="fx-controls">
                        <div class="fx-group">
                            <label>RATE</label>
                            <input type="range" class="fx-slider" id="tremoloRate" min="0.1" max="15" step="0.1"
                                value="5">
                            <span class="fx-value" id="tremoloRateValue">5.0Hz</span>
                        </div>
                        <div class="fx-group">
                            <label>DEPTH</label>
                            <input type="range" class="fx-slider" id="tremoloDepth" min="0" max="100" step="1"
                                value="0">
                            <span class="fx-value" id="tremoloDepthValue">0%</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filter Cutoff LFO -->
            <div class="filter-mod-panel">
                <div class="panel-header">
                    <i class="fas fa-wave-square"></i> CUTOFF MODULATION (LFO)
                </div>
                <div class="fx-controls">
                    <div class="fx-group">
                        <label>TYPE</label>
                        <div class="custom-select-container" id="filterLFOTypeContainer">
                            <div class="custom-select-trigger" id="filterLFOTypeTrigger">Sine</div>
                            <div class="custom-options" id="filterLFOTypeOptions">
                                <div class="custom-option selected" data-value="sine">Sine</div>
                                <div class="custom-option" data-value="square">Square</div>
                                <div class="custom-option" data-value="sawtooth">Saw</div>
                                <div class="custom-option" data-value="triangle">Triangle</div>
                                <div class="custom-option" data-value="random">Random</div>
                            </div>
                        </div>
                    </div>
                    <div class="fx-group">
                        <label>RATE</label>
                        <input type="range" class="fx-slider" id="filterLFORate" min="0.1" max="20" step="0.1"
                            value="3">
                        <span class="fx-value" id="filterLFORateValue">3.0Hz</span>
                    </div>
                    <div class="fx-group">
                        <label>DEPTH (MULT)</label>
                        <input type="range" class="fx-slider" id="filterLFODepth" min="0" max="1" step="0.01" value="0">
                        <span class="fx-value" id="filterLFODepthValue">0%</span>
                    </div>
                </div>
            </div>

            <!-- Waveform Visualizer -->
            <div class="waveform-panel">
                <div class="panel-header">
                    <i class="fas fa-wave-square"></i> WAVEFORM
                </div>
                <canvas id="waveformCanvas" width="600" height="140"></canvas>
            </div>

        </div>
    </div>

    <script src="../mixer_fx.js"></script>
    <script src="synth_additive_.js"></script>
</body>

</html>
