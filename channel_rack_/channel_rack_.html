<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Actam Channel Rack</title>
    <link rel="stylesheet" href="channel_rack_.css">
</head>

<body>
    <div id="sequencer-container">
        <!-- I 4 sequencer verranno generati da JS -->
    </div>

    <div id="controls">
        <button id="playBtn">PLAY</button>
        <button id="stopBtn">STOP</button>
        <div class="tempo-control">
            <label>BPM</label>
            <input type="number" id="bpmInput" value="120" min="40" max="240">
        </div>
        <div class="tempo-control">
            <label>STEPS</label>
            <input type="number" id="stepsInput" value="16" min="1" max="64">
        </div>
        <div class="tempo-control">
            <label>TRACKS</label>
            <input type="number" id="tracksInput" value="4" min="1" max="16">
        </div>
        <div class="tempo-control">
            <label>GRID</label>
            <select id="quantizationSelect">
                <option value="0.25">1/64</option>
                <option value="0.5">1/32</option>
                <option value="1" selected>1/16</option>
                <option value="1.3333333333333333">1/12 (1/3)</option>
                <option value="0.6666666666666666">1/24 (1/6)</option>
            </select>
        </div>
    </div>

    <script src="../mixer_fx.js"></script>
    <script src="channel_rack_.js"></script>
</body>

</html>
